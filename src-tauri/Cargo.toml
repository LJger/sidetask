[package]
name = "sidetask"
version = "1.3.4"
description = "侧记 · 本地任务工具"
edition = "2021"
rust-version = "1.98"
license = "MIT"
default-run = "SideTask"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "sidetask_core"

[[bin]]
name = "SideTask"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
rfd = { version = "0.15", features = ["common-controls-v6"] }
winreg = "0.55"
windows = { version = "0.61", features = [
  "Data_Xml_Dom", "Foundation", "UI_Notifications",
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com",
  "Win32_System_Power", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_Controls",
  "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
